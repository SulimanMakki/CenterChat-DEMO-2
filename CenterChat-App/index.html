<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Center Chat</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('cc_theme')||'dark'}catch(e){}</script>
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Center Chat">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--panel:#111c33;--card:#162340;--line:#233453;--txt:#e7edf6;--mut:#8696b0;--acc:#10b981;--out:#0b5d4b;--in:#1b2a47;--read:#38bdf8}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.55 'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--txt);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hide{display:none!important}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* auth */
#auth{min-height:100%;display:grid;place-items:center;padding:20px}
.box{width:min(390px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px 26px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand img{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 0 18px #10b98155}
#ld .brand img{width:76px;height:76px}
#bl .lgo{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;opacity:.95}
.brand h1{font-size:23px;font-weight:600}
.sub{color:var(--mut);margin-bottom:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:16px}
.tabs button{padding:8px;border-radius:9px;color:var(--mut)}
.tabs .on{background:var(--card);color:var(--txt)}
label{display:block;margin-bottom:12px;color:var(--mut);font-size:13px}
label input{display:block;width:100%;margin-top:5px;padding:11px 13px;background:var(--bg);border:1px solid var(--line);border-radius:11px;font-size:15px}
.go{width:100%;padding:12px;margin-top:6px;background:var(--acc);color:#04251c;border-radius:11px;font-weight:600}
.go:hover{filter:brightness(1.08)}
.err{color:#fca5a5;min-height:22px;font-size:13px;margin-top:8px}
.note{color:var(--mut);font-size:12.5px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.lg{color:var(--mut);font-size:13px;padding:4px 8px;border-radius:8px}
.lg:hover{color:var(--txt);background:var(--card)}
/* app */
#app{height:100vh;height:100dvh;display:grid;grid-template-columns:68px minmax(300px,380px) 1fr}
#rail{background:#0c1426;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
#rail button{position:relative;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;color:var(--mut)}
#rail button:hover{background:var(--card);color:var(--txt)}
#rail button.on{background:var(--card);color:var(--acc)}
#rail .sp{flex:1}
#rb{position:absolute;top:2px;inset-inline-end:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#04251c;font-style:normal;font-weight:600;font-size:11px;line-height:18px;text-align:center}
.pn{display:flex;flex-direction:column;min-height:0;flex:1}
.top h2{font-size:19px;font-weight:600}
.pad{padding:6px 18px 20px;overflow:auto}
.big{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 18px}
.big .av{width:88px;height:88px;font-size:36px}
.big .ph{color:var(--mut);direction:ltr}
.row{display:block;width:100%;text-align:start;padding:13px 4px;border-top:1px solid var(--line)}
.row:hover{color:var(--acc)}
.row.dg{color:#fca5a5}
.ok{color:var(--acc);font-size:13px;min-height:20px;margin-top:6px}
#side{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.top{display:flex;align-items:center;gap:10px;padding:14px 16px}
.top b{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sr{padding:0 14px 10px}
.sr input{width:100%;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
#list{flex:1;overflow:auto;padding:0 8px 10px}
.it{display:flex;align-items:center;gap:12px;width:100%;padding:10px 10px;border-radius:12px;text-align:start}
.it:hover{background:var(--card)}
.it.on{background:var(--card);box-shadow:inset 3px 0 0 var(--acc)}
[dir=rtl] .it.on{box-shadow:inset -3px 0 0 var(--acc)}
.mid{flex:1;min-width:0;display:flex;flex-direction:column}
.mid b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{color:var(--mut);font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.end{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:12px;color:var(--mut)}
.end em{font-style:normal;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#04251c;font-weight:600;display:grid;place-items:center}
.av{position:relative;flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:18px}
.dot{position:absolute;bottom:0;inset-inline-end:0;width:12px;height:12px;border-radius:50%;background:var(--acc);border:2px solid var(--panel)}
.empty{color:var(--mut);text-align:center;padding:36px 20px}
.tk{letter-spacing:-4px;margin-inline-end:4px;color:var(--mut);font-size:13px}
.tk.read{color:var(--read)}
.tp{color:var(--acc);font-style:normal}
/* chat */
#chat{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.ch{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.ch .av{width:42px;height:42px;font-size:16px}
.ch div.tt{flex:1;min-width:0}
.ch b{display:block;font-weight:600;line-height:1.3}
.st{display:block;font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{display:none;padding:6px}
[dir=rtl] .back svg,[dir=rtl] .snd svg{transform:scaleX(-1)}
#msgs{flex:1;overflow:auto;padding:16px 5%;display:flex;flex-direction:column;direction:ltr;background-image:radial-gradient(#1a2744 1px,transparent 1px);background-size:22px 22px}
.m{max-width:min(78%,520px);width:fit-content;padding:7px 11px 4px;margin:3px 0;border-radius:14px;overflow-wrap:anywhere}
.m.out{margin-left:auto;background:var(--out);border-bottom-right-radius:4px}
.m.in{margin-right:auto;background:var(--in);border-bottom-left-radius:4px}
.m p{white-space:pre-wrap}
.m img{display:block;max-width:100%;max-height:320px;border-radius:9px;margin-bottom:4px}
.fl{display:flex;flex-direction:column;padding:9px 12px;margin-bottom:4px;background:#0003;border-radius:9px;color:inherit;text-decoration:none}
.fl small{color:var(--mut)}
.mt{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:11.5px;color:#ffffffa0;margin-top:1px;direction:ltr}
.dots{display:flex;gap:5px;padding:12px 14px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:b 1.1s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes b{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.blank{flex:1;display:grid;place-content:center;text-align:center;color:var(--mut);padding:20px}
.blank h2{color:var(--txt);font-weight:600;margin-bottom:4px}
#pv{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
#pv img{width:46px;height:46px;object-fit:cover;border-radius:8px}
#pv span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cp{display:flex;align-items:flex-end;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.cp textarea{flex:1;resize:none;max-height:130px;padding:10px 14px;background:var(--bg);border:1px solid var(--line);border-radius:20px;line-height:1.5}
.ic{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--mut)}
.ic:hover{background:var(--card);color:var(--txt)}
.snd{background:var(--acc);color:#04251c}
.snd:hover{background:var(--acc);filter:brightness(1.1);color:#04251c}
@media(max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
 #rail{order:2;flex-direction:row;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));border-inline-end:0;border-top:1px solid var(--line)}
 #rail .sp{display:none}
 #chat{display:none;grid-row:1}
 #app.open #side,#app.open #rail{display:none}
 #app.open #chat{display:flex}
 .back{display:block}
 #msgs{padding:12px 10px}
}
.vm{display:flex;align-items:center;gap:10px;min-width:210px;padding:4px 2px;direction:ltr}
.pl{width:36px;height:36px;border-radius:50%;background:#ffffff22;display:grid;place-items:center;font-size:14px;flex:none}
.pl:hover{background:#ffffff38}
.bar{flex:1;height:5px;border-radius:3px;background:#ffffff30;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#a7f3d0}
.du{font-size:12px;color:#ffffffb0;min-width:34px}
.sy{align-self:center;margin:8px 0;padding:5px 14px;border-radius:12px;background:#1b2a47bb;color:var(--mut);font-size:13px;display:flex;gap:10px}
.sy time{opacity:.7}
.rc{display:flex;align-items:center;gap:12px;flex:1}
.rd{width:11px;height:11px;border-radius:50%;background:#ef4444;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.25}}
#rt{font-variant-numeric:tabular-nums;min-width:40px}
.rl{flex:1;color:var(--mut);display:flex;flex-direction:column;gap:5px;font-size:13px}
.lvl{height:6px;border-radius:3px;background:#ffffff20;overflow:hidden}
.lvl i{display:block;height:100%;width:0;background:var(--acc);transition:width .08s}
.cp.rec>:not(#rc){display:none!important}
.cp:not(.rec)>#rc{display:none}
#tt{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#0b1220;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:12;max-width:90vw;text-align:center}
#cl{position:fixed;inset:0;z-index:10;background:radial-gradient(circle at 50% 30%,#14304a,#0b1220 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px}
#cl .av{width:120px;height:120px;font-size:50px;margin-bottom:8px}
#cl h2{font-size:26px;font-weight:600}
#cs{color:var(--mut);font-variant-numeric:tabular-nums;min-height:24px}
.cb{display:flex;gap:26px;margin-top:40px}
.cbtn{width:64px;height:64px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center}
.cbtn svg{width:28px;height:28px}
.cbtn.act{background:#fff;color:#0f172a}
.cbtn.red{background:#ef4444}
.cbtn.red svg{transform:rotate(135deg)}
.cbtn.grn{background:var(--acc);color:#04251c}
.ch{cursor:pointer}
.m{position:relative}
.mb{position:absolute;top:3px;right:5px;width:22px;height:22px;border-radius:50%;background:#0b1220aa;color:#fff;font-size:13px;line-height:1;display:grid;place-items:center;opacity:0}
.m:hover .mb,.mb:focus-visible{opacity:1}
@media(hover:none){.mb{opacity:.6}}
.sn{display:block;font-size:13px;font-weight:600;margin-bottom:1px}
.qt{border-left:3px solid;background:#00000030;border-radius:8px;padding:4px 8px;margin-bottom:5px;display:flex;flex-direction:column;font-size:13px}
.qt b{font-size:12px}
.qt span{color:#ffffffb8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rx{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:12px;background:#00000040;font-size:13px}
.dl{font-style:italic;color:#ffffffb0}
.mt small{opacity:.8;font-size:11px}
#mm{position:fixed;z-index:11;min-width:190px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px #0009;display:flex;flex-direction:column}
#mm button{padding:9px 12px;text-align:start;border-radius:9px}
#mm button:hover{background:var(--bg)}
#mm .dg{color:#fca5a5}
#mm .er{display:flex;gap:2px;padding:2px 2px 6px;border-bottom:1px solid var(--line);margin-bottom:4px}
#mm .er button{font-size:20px;padding:4px 6px}
#bn{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--panel);border-top:1px solid var(--line)}
.bq{width:4px;align-self:stretch;border-radius:2px;background:var(--acc)}
.bt{flex:1;min-width:0;display:flex;flex-direction:column}
.bt b{color:var(--acc);font-size:13px}
.bt span{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin:0 18px 8px}
.seg button{padding:8px;border-radius:9px;color:var(--mut)}
.seg .on{background:var(--card);color:var(--txt)}
#gl{max-height:38vh;overflow:auto;margin-bottom:10px}
.ck{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:10px;cursor:pointer;color:var(--txt);margin:0}
.ck:hover{background:var(--card)}
.ck input{display:inline-block;width:18px;height:18px;margin:0;padding:0;border:0;background:none;accent-color:var(--acc)}
.ck .av,.mr .av{width:36px;height:36px;font-size:15px}
#inf{position:absolute;inset-block:0;inset-inline-end:0;width:min(380px,100%);z-index:5;background:var(--panel);border-inline-start:1px solid var(--line);display:flex;flex-direction:column}
.ih{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#infc{flex:1;overflow:auto}
.sec{padding:12px 0;border-top:1px solid var(--line)}
.sec h4{color:var(--mut);font-size:13px;font-weight:500;margin-bottom:6px}
.mut{color:var(--mut)}
.big h3{font-size:20px;font-weight:600}
.mr{display:flex;align-items:center;gap:10px;padding:6px 0}
.mr>div{flex:1;min-width:0}
.tag{font-size:12px;color:var(--acc);border:1px solid var(--acc);border-radius:8px;padding:0 7px}
select{width:100%;padding:10px;margin-bottom:8px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:11px;font:inherit}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.big #sav{cursor:pointer}
#ld{position:fixed;inset:0;z-index:9;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:18px;color:var(--mut)}
.spin{width:46px;height:46px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--acc);animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none}.spin{animation-duration:2.6s}}
#eb{font-size:22px}
#ep{position:fixed;z-index:11;width:min(340px,94vw);background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px #0009}
#ept{display:flex;padding:4px;border-bottom:1px solid var(--line);overflow:auto}
#ept button,#epg button{font-size:22px;border-radius:8px;padding:4px;line-height:1.2;flex:none}
#ept button.on,#ept button:hover,#epg button:hover{background:var(--bg)}
#epg{display:grid;grid-template-columns:repeat(8,1fr);max-height:240px;overflow:auto;padding:6px}
#mm .er .mo{font-size:16px;color:var(--mut)}
#kl{flex:1;overflow:auto;padding:0 8px 10px}
.it.ms .pv{color:#fca5a5}
#vb:not(.hide)+#cb,#cb{}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1}
#lv2{position:absolute;top:16px;inset-inline-end:16px;width:110px;border-radius:12px;transform:scaleX(-1)}
#hm{position:fixed;z-index:11;min-width:200px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 10px 30px #0009;display:flex;flex-direction:column}
#hm button{padding:9px 12px;text-align:start;border-radius:9px}
#hm button:hover{background:var(--bg)}
#hm .dg{color:#fca5a5}
#pb{padding:7px 16px;background:var(--card);border-bottom:1px solid var(--line);color:var(--mut);font-size:13.5px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sb{padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
#sb input{width:100%;padding:8px 14px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
#fw{position:fixed;inset:0;z-index:12;background:#0008;display:grid;place-items:center}
.fwb{width:min(380px,94vw);max-height:80vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px}
#fwl{overflow:auto;padding:0 8px 10px}
#mn{position:absolute;bottom:70px;inset-inline-start:14px;z-index:6;width:min(300px,90%);max-height:220px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px}
#mn button{display:flex;align-items:center;gap:8px;width:100%;padding:6px;border-radius:8px;text-align:start}
#mn button:hover{background:var(--bg)}
#mn .av{width:30px;height:30px;font-size:13px}
.mn{color:#7dd3fc;font-weight:600}
.fb{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:6px solid transparent;background:var(--card);background-clip:padding-box;border-radius:50%;color:var(--mut);display:grid;place-items:center;opacity:0}
.m.out .fb{right:100%}.m.in .fb{left:100%}
.m:hover .fb,.fb:focus-visible{opacity:1}
@media(hover:none){.fb{opacity:.6}}
.lsel{margin-top:10px}
#rab{position:absolute;top:2px;inset-inline-end:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--acc);color:#04251c;font-style:normal;font-weight:600;font-size:11px;line-height:18px;text-align:center}
[data-theme=light]{--bg:#eef2f7;--panel:#fff;--card:#e6edf5;--line:#d3dce8;--txt:#0f172a;--mut:#5b6b82;--acc:#059669;--out:#d1fae5;--in:#fff;--read:#0284c7}
[data-theme=light] #rail{background:#dfe6ef}
[data-theme=light] #msgs{background-image:radial-gradient(#d3dce8 1px,transparent 1px)}
[data-theme=light] .mt,[data-theme=light] .du{color:#5b6b82}
[data-theme=light] .pl{background:#0000001a}
[data-theme=light] .pl:hover{background:#0000002a}
[data-theme=light] .bar,[data-theme=light] .lvl{background:#00000020}
[data-theme=light] .bar i{background:#059669}
[data-theme=light] .qt{background:#0000000d}
[data-theme=light] .qt span,[data-theme=light] .dl{color:#475569}
[data-theme=light] .fl{background:#0000000d}
[data-theme=light] .rx{background:#0000000f}
[data-theme=light] .mb,[data-theme=light] .fb{background:#fffffff0;color:#0f172a}
[data-theme=light] .sy{background:#e2e8f0e6}
[data-theme=light] #tt{background:#fff;color:#0f172a}
[data-theme=light] .err,[data-theme=light] .row.dg,[data-theme=light] .it.ms .pv,[data-theme=light] #hm .dg,[data-theme=light] #mm .dg{color:#dc2626}
[data-theme=light] #cl{color:#e7edf6}
[data-theme=light] #cl #cs{color:#9fb0c8}
[data-theme=light] .mn{color:#0369a1}
#grid{order:5;display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:14px}
.cb{order:9}
.tl{position:relative;width:96px;height:96px;border-radius:16px;overflow:hidden;background:#ffffff14;display:grid;place-items:center}
.tl .av{width:56px;height:56px;font-size:22px}
.tl video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.tl .nm{position:absolute;bottom:3px;inset-inline:4px;font-size:11px;text-align:center;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#cl.vid #grid{position:absolute;inset:0;z-index:-1;margin:0;padding:6px;gap:6px;align-content:stretch}
#cl.vid .tl{flex:1 1 min(300px,45%);width:auto;height:auto;border-radius:12px}
#cl.vid .tl video{opacity:1}
#cl.vid.live #cav{display:none}

/* ---------- accounts ---------- */
const ACC=()=>jget('cc_acc',{});
const norm=s=>s.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[\s\-()]/g,'');
const okPhone=p=>/^\+?\d{8,15}$/.test(p);
const okMail=s=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);
async function hp(p){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(unescape(encodeURIComponent(p)))}}
$$('.tabs button').forEach(b=>b.onclick=()=>{
 mode=b.dataset.mode;$$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
 $('#nl').classList.toggle('hide',mode==='login');$('#el').classList.toggle('hide',mode==='login');$('#go').textContent=t(mode==='login'?'go1':'go2');$('#er').textContent='';
});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const loader=on=>$('#ld').classList.toggle('hide',!on);
function failSafe(msg){loader(false);$('#app').classList.add('hide');$('#auth').classList.remove('hide');$('#er').textContent=msg}
addEventListener('error',e=>{if(started){console.error(e.error||e.message);toast('oops')}else failSafe(t('oops')+' ('+e.message+')')});
$('#f').onsubmit=async e=>{
 e.preventDefault();
 const p=norm($('#u').value),pw=$('#p').value,n=$('#n').value.trim(),em=$('#em').value.trim().toLowerCase(),er=$('#er'),A=ACC();
 er.textContent='';
 if(!p||!pw||(mode==='reg'&&!n)){er.textContent=t('fill');return}
 if(mode==='reg'&&!okMail(em)){er.textContent=t('emailBad');return}
 if(!okPhone(p)){er.textContent=t('phoneBad');return}
 loader(true);
 try{
  const h=await hp(pw);
  if(mode==='reg'){
   if(A[p]){loader(false);er.textContent=t('exists');return}
   A[p]={name:n,phone:p,email:em,about:t('aboutDef'),avatar:'',h};if(!jset('cc_acc',A)){loader(false);return}
  }else{
   if(!A[p]){loader(false);er.textContent=t('nofound');return}
   if(A[p].h!==h){loader(false);er.textContent=t('wrong');return}
  }
  me=A[p];ses.set('cc_me',p);store.set('cc_me',p);
  await wait(900);start();loader(false);
 }catch(err){console.error(err);failSafe(t('oops')+' ('+(err&&err.message||err)+')')}
};

$('#ff').onsubmit=async e=>{
 e.preventDefault();const em=$('#fe').value.trim().toLowerCase(),np=$('#fp').value,er=$('#fr'),A=ACC();er.textContent='';
 if(!okMail(em)){er.textContent=t('emailBad');return}
 if(!np){er.textContent=t('fill');return}
 const k=Object.keys(A).find(x=>(A[x].email||'')===em);if(!k){er.textContent=t('noEmail');return}
 A[k].h=await hp(np);if(jset('cc_acc',A)){e.target.reset();fgView(false);toast('fgDone')}
};

 else if(a==='gphoto'){if(c.group&&c.owner)$('#gvf').click()}
 else if(a==='gphotorm'){if(c.group&&c.owner){mut(key,cv=>{delete cv.avatar;cv.msgs.push(sysMsg('gphoto',me.phone))});renderInfo()}}
 else if(a==='block'){if(c.blk||confirm(t('blockq'))){const A=ACC(),x=A[me.phone];x.blocked=c.blk?(x.blocked||[]).filter(p=>p!==c.phone):[...(x.blocked||[]),c.phone];jset('cc_acc',A);me=x;refresh();renderInfo()}}
 else if(a==='mkadm'||a==='rmadm'){const p=b.dataset.p;mut(key,cv=>{cv.admins=(cv.admins||[]).filter(x=>x!==p);if(a==='mkadm')cv.admins.push(p)});renderInfo()}
 else if(a==='clear'){if(confirm(t('clr1q'))){AU.pause();pl=null;mut(key,cv=>{cv.clr=cv.clr||{};cv.clr[me.phone]=Date.now()});renderInfo()}}
 else if(a==='delchat'){if(confirm(t('delchatq'))){closeChat();mut(key,cv=>{cv.vis=(cv.vis||[]).filter(p=>p!==me.phone);cv.clr=cv.clr||{};cv.clr[me.phone]=Date.now()})}}
 else if(a==='leave'){if(confirm(t('leaveq'))){closeChat();mut(key,cv=>{cv.members=cv.members.filter(p=>p!==me.phone);cv.vis=(cv.vis||[]).filter(p=>p!==me.phone);if(cv.owner===me.phone)cv.owner=cv.members[0]||'';cv.msgs.push(sysMsg('left',me.phone))})}}
 else if(a==='rm'){const p=b.dataset.p;mut(key,cv=>{cv.members=cv.members.filter(x=>x!==p);cv.msgs.push(sysMsg('removed',p))});renderInfo()}
 else if(a==='addm'){const p=$('#ams').value;if(p){mut(key,cv=>{if(cv.members.includes(p))return;cv.members.push(p);cv.vis=cv.members.slice();cv.clr=cv.clr||{};cv.clr[p]=Date.now()-1;cv.msgs.push(sysMsg('added',p))});renderInfo()}}
});
$('#infc').addEventListener('submit',e=>{
 if(e.target.id!=='inn')return;e.preventDefault();const v=$('#inm').value.trim(),c=C[cur];if(!c||!v)return;
 if(c.group)mut(c.key,cv=>{cv.name=v});

});

/* ---------- add user / new group ---------- */
$('#af').onsubmit=e=>{
 e.preventDefault();const p=norm($('#ap').value),n=$('#an').value.trim(),er=$('#ae');
 if(!okPhone(p)){er.textContent=t('phoneBad');return}
 if(p===me.phone){er.textContent=t('self');return}
 if(!ACC()[p]){er.textContent=t('notreg');return}
 const id=dmId(me.phone,p);let cv=loadConv('cc_c:'+id);
 if(cv)cv.vis=[...new Set([...(cv.vis||[]),me.phone])];
 else cv={id,type:'d',members:[me.phone,p],vis:[me.phone],msgs:[],clr:{},ct:Date.now()};
 if(!putConv(cv))return;
 if(n){AL[p]=n;jset('cc_al:'+me.phone,AL)}
 e.target.reset();er.textContent='';curKey=id;refresh();tab('chats');open(C.findIndex(c=>c.key===id));
};
function fillGroup(){
 const l=C.filter(c=>!c.group);
 $('#gl').innerHTML=l.length?l.map(c=>`<label class="ck"><input type="checkbox" value="${esc(c.phone)}">${av(c.name,0,false,c.avatar)}<span dir="auto">${esc(c.name)}</span></label>`).join(''):`<p class="empty">${t('gnone')}</p>`;
}
$$('.seg button').forEach(b=>b.onclick=()=>{
 $$('.seg button').forEach(x=>x.classList.toggle('on',x===b));
 $('#af').classList.toggle('hide',b.dataset.add!=='u');$('#gf').classList.toggle('hide',b.dataset.add!=='g');fillGroup();
});
$('#gf').onsubmit=e=>{
 e.preventDefault();const n=$('#gn').value.trim(),ph=$$('#gl input:checked').map(x=>x.value),er=$('#ge');
 if(!n||!ph.length){er.textContent=t('gneed');return}
 const id='g:'+uid(),now=Date.now(),mem=[me.phone,...ph];
 if(!putConv({id,type:'g',name:n,owner:me.phone,members:mem,vis:mem.slice(),msgs:[{id:uid(),sy:'gmade',n,t:now,from:me.phone}],clr:{},ct:now}))return;
 e.target.reset();er.textContent='';curKey=id;refresh();tab('chats');open(C.findIndex(c=>c.key===id));
};

/* ---------- settings ---------- */
function fillSet(){$('#sav').innerHTML=av(me.name,0,false,me.avatar);$('#sp').textContent=me.phone;$('#sn').value=me.name;$('#sa').value=me.about||'';$('#se').value=me.email||''}
$('#sf').onsubmit=e=>{
 e.preventDefault();const A=ACC(),a=A[me.phone];if(!a)return;
 a.name=$('#sn').value.trim()||a.name;a.about=$('#sa').value.trim();const se=$('#se').value.trim().toLowerCase();if(se&&!okMail(se)){$('#ss').textContent=t('emailBad');return}a.email=se;
 if(jset('cc_acc',A)){me=a;fillSet();$('#ss').textContent=t('saved');refresh()}
};
$('#sav').onclick=()=>$('#avf').click();
$('#avf').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const u=await img2url(f,160,true,.8),A=ACC();A[me.phone].avatar=u;if(jset('cc_acc',A)){me=A[me.phone];fillSet();refresh()}}catch(x){toast('oops')}
};
function eachMine(fn){for(const k of convKeys()){const cv=loadConv(k);if(cv&&cv.members.includes(me.phone)){fn(cv,k);putConv(cv)}}}
$('#cc').onclick=()=>{if(confirm(t('ccq'))){eachMine(cv=>{cv.clr=cv.clr||{};cv.clr[me.phone]=Date.now()});closeChat();refresh()}};
function leaveApp(){ses.del('cc_me');if(store.get('cc_me')===me.phone)store.del('cc_me');store.del('cc_p:'+me.phone);location.reload()}
$('#lo').onclick=leaveApp;
$('#dl').onclick=()=>{
 if(!confirm(t('delq')))return;
 const ph=me.phone;
 for(const k of convKeys()){const cv=loadConv(k);if(!cv||!cv.members.includes(ph))continue;
  if(cv.type==='d')store.del(k);
  else{cv.members=cv.members.filter(p=>p!==ph);if(cv.owner===ph)cv.owner=cv.members[0]||'';cv.members.length?putConv(cv):store.del(k)}}
 const A=ACC();delete A[ph];jset('cc_acc',A);store.del('cc_al:'+ph);bump();leaveApp();
};

/* ---------- header menu, search, pinned bar, forward, mentions, password ---------- */

$('#sc').onclick=()=>toggleSb($('#sb').classList.contains('hide'));
$('#sq2').oninput=()=>{chatQ=$('#sq2').value.trim().toLowerCase();renderChat()};
$('#pb').onclick=()=>{const c=C[cur];if(!c||!c.pm)return;const el=$('#msgs').querySelector('.m[data-i="'+c.pm+'"]');if(el)el.scrollIntoView({block:'center'})};
$('#mo').onclick=e=>{const c=C[cur];if(!c)return;const h=$('#hm');
 h.innerHTML=`<button data-a="info">${t('info')}</button><button data-a="sch">${t('sch')}</button><button data-a="pinc">${t(c.pinned?'unpinc':'pinc')}</button><button data-a="arch">${t(c.arch?'unarch':'archit')}</button>`+(c.group?'':`<button class="dg" data-a="block">${t(c.blk?'unblock':'block')}</button>`);
 h.classList.remove('hide');const b=e.currentTarget.getBoundingClientRect();h.style.top=b.bottom+4+'px';h.style.left=Math.max(8,Math.min(b.left,innerWidth-h.offsetWidth-8))+'px'};

 if(a==='info')openInfo();
 else if(a==='sch')toggleSb(true);
 else if(a==='block'){openInfo();$('#infc [data-a="block"]').click()}
 else{const arch=a==='arch';mut(c.key,cv=>{const f=arch?'arch':'pin';cv[f]=cv[f]||{};if(cv[f][me.phone])delete cv[f][me.phone];else cv[f][me.phone]=1});if(arch)closeChat()}};
var fwCb=null;
function openFw(m){fwM=m;fwCb=null;$('#fw .top b').textContent=t('fwdT');$('#fwl').innerHTML=C.filter(c=>!c.blk).map(c=>`<button class="it" data-key="${esc(c.key)}">${av(c.name,0,c.group,c.avatar)}<div class="mid"><b dir="auto">${esc(c.name)}</b></div></button>`).join('')||`<p class="empty">${t('noChats')}</p>`;$('#fw').classList.remove('hide')}
$('#fwx').onclick=()=>$('#fw').classList.add('hide');
$('#fwl').onclick=e=>{const b=e.target.closest('.it');if(!b||!fwM)return;const m=fwM,cv=loadConv('cc_c:'+b.dataset.key);if(!cv)return;
 const x={id:uid(),from:me.phone,t:Date.now(),dv:[],rd:[],fw:1,text:m.text||''};if(m.aud){x.aud=m.aud;x.dur=m.dur}if(m.img)x.img=m.img;if(m.file){x.file=m.file;x.url=m.url}
 if(cv.type==='d'){const p=cv.members.find(z=>z!==me.phone);if(((AC[p]||{}).blocked||[]).includes(me.phone))x.nb=[p]}
 cv.msgs.push(x);cv.vis=cv.members.slice();if(putConv(cv)){$('#fw').classList.add('hide');fwM=null;toast('fwdDone');refresh()}};
function mnCheck(){const c=C[cur],b=$('#mn');if(!c||!c.group){b.classList.add('hide');return}
 const m=/@([^\s@]*)$/.exec(tx.value.slice(0,tx.selectionStart));if(!m){b.classList.add('hide');return}
 const q=m[1].toLowerCase(),l=c.members.filter(x=>x.name.toLowerCase().includes(q));if(!l.length){b.classList.add('hide');return}
 b.innerHTML=l.map(x=>`<button data-n="${esc(x.name)}">${av(x.name,0,false,x.avatar)}<span dir="auto">${esc(x.name)}</span></button>`).join('');b.classList.remove('hide')}

$('#pf').onsubmit=async e=>{e.preventDefault();const A=ACC(),a=A[me.phone],m=$('#pm');m.textContent='';const o=$('#po').value,n=$('#pn').value;

 a.h=await hp(n);if(jset('cc_acc',A)){me=a;e.target.reset();m.textContent=t('passDone')}};

function start(){
 started=true;$('#auth').classList.add('hide');$('#app').classList.remove('hide');
 const hb=()=>{if(me){store.set('cc_p:'+me.phone,String(Date.now()));store.set('cc_ls:'+me.phone,String(Date.now()))}};hb();
 seenV=store.get('cc_v')||'';seenS=store.get('cc_s:'+me.phone)||'';
 if(!start.on){start.on=1;setInterval(hb,4000);setInterval(pulse,1500);setInterval(poll,1000)}
 setLang();fillSet();tab('chats');refresh(true);
}
{const A=ACC();let p=ses.get('cc_me');if(!(p&&A[p])){p=store.get('cc_me');if(!(p&&A[p]&&!online(p)))p=null}if(p)me=A[p]}
setLang();if(!store.ok)$('#ns').classList.remove('hide');
try{if(me)start()}catch(err){console.error(err);ses.del('cc_me');failSafe('')}
